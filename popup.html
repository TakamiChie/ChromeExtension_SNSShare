<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNS共有</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <h1>SNSに共有</h1>
    <p id="pageInfo" class="page-info">現在のタブを取得中...</p>
    <div class="button-list">
      <button data-service="facebook">Facebook</button>
      <button data-service="x">X</button>
      <button data-service="bluesky">Bluesky</button>
      <button data-service="mastodon">Mastodon</button>
      <button data-service="threads">Threads</button>
    </div>
    <div class="footer">
      <button id="openOptions" class="secondary">設定を開く</button>
    </div>
    <p class="note">
      Facebookは仕様上、URLは共有できますが、タイトル文言の事前入力は環境によって反映されないことがあります。
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
