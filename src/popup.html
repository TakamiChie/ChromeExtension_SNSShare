<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNS共有</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="container">
    <h1>SNSに共有</h1>
    <p id="pageInfo" class="page-info">現在のタブを取得中...</p>
    <textarea id="shareText" rows="4" placeholder="共有テキストを編集してください"></textarea>
    <div class="checkbox-list">
      <label><input type="checkbox" data-service="facebook"
          title="Facebookは仕様上、URLは共有できますが、タイトル文言の事前入力は環境によって反映されないことがあります。"> Facebook</label>
      <label><input type="checkbox" data-service="x"> X</label>
      <label><input type="checkbox" data-service="bluesky"> Bluesky</label>
      <label><input type="checkbox" data-service="mastodon"> Mastodon</label>
      <label><input type="checkbox" data-service="threads"> Threads</label>
      <label><input type="checkbox" data-service="mixi2"
          title="mixi2の投稿画面を開き、共有テキストを入力します。"> mixi2</label>
    </div>
    <button id="shareButton">共有</button>
    <div class="footer">
      <button id="openOptions" class="secondary">設定を開く</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>

</html>
